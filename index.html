<!doctype html>
<html lang="ru">
<head>
{% load static %}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PROBRO · Наружная реклама в Новосибирске</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Bebas+Neue&family=Archivo+Black&family=Space+Grotesk:wght@500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">

<style id="brand-accent-critical">
  /* До React: только базовый акцент; остальное токены в styles.css от var(--accent) */
  :root {
    --accent: #631caa;
    --accent-glow: color-mix(in srgb, var(--accent) 35%, transparent);
  }
</style>
<link rel="stylesheet" href="{% static 'styles.css' %}">
<link rel="stylesheet" href="{% static 'styles-header-hero.css' %}">
<link rel="stylesheet" href="{% static 'styles-sections.css' %}">
<link rel="stylesheet" href="{% static 'styles-rest.css' %}">
</head>
<body>
<div id="root"></div>
<script>
  window.STATIC_URL = "{% static '' %}";
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="{% static 'api-client.jsx' %}"></script>

<script type="text/babel" src="{% static 'about.jsx' %}"></script>
<script type="text/babel" src="{% static 'services.jsx' %}"></script>
<script type="text/babel" src="{% static 'portfolio.jsx' %}"></script>
<script type="text/babel" src="{% static 'contacts.jsx' %}"></script>
<script type="text/babel" src="{% static 'footer.jsx' %}"></script>
<script type="text/babel" src="{% static 'app.jsx' %}"></script>

</html>
